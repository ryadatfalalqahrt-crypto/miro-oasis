name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Create Cordova app and copy www
        run: |
          npm install -g cordova
          cordova create miro_app com.miro.oasis "Miro Oasis"
          rm -rf miro_app/www
          cp -r www miro_app/www
          cd miro_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: miro_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
