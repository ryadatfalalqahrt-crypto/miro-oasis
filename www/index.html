<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>واحة ميرو للألوان والأشكال</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #fff8e7 0%, #e7f6ff 100%);
      color: #233044;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .pill {
      background: #ffffff;
      border: 2px solid #d9e8f5;
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(35, 48, 68, 0.06);
    }

    .icon-btn {
      background: #ffffff;
      border: 2px solid #d9e8f5;
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 700;
      color: #233044;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 48, 68, 0.06);
      transition: transform 0.12s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.25s ease;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .miro-card {
      background: #ffffff;
      border: 3px solid #ffe08a;
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      box-shadow: 0 10px 24px rgba(217, 167, 56, 0.14);
      margin-bottom: 20px;
    }

    .miro-avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe699, #f4b41a);
      border: 4px solid #fff3cd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      box-shadow: 0 8px 18px rgba(244, 180, 26, 0.25);
    }

    h1 {
      margin: 6px 0 8px;
      font-size: 25px;
      color: #1c2b4a;
    }

    p.subtitle {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #51627a;
    }

    .btn-primary {
      width: 100%;
      border: none;
      border-radius: 20px;
      padding: 15px 20px;
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      background: linear-gradient(135deg, #2b8a3e, #37b24d);
      box-shadow: 0 6px 0 #1e662c, 0 12px 20px rgba(43, 138, 62, 0.22);
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.12s ease;
    }

    .btn-primary:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #1e662c;
    }

    .btn-secondary {
      width: 100%;
      border: 2px solid #90caf9;
      border-radius: 20px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: 700;
      color: #185a9d;
      background: #e3f2fd;
      cursor: pointer;
      margin-bottom: 10px;
      transition: transform 0.12s ease;
    }

    .btn-secondary:active {
      transform: scale(0.98);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      margin: 14px 0 18px;
    }

    .item-card {
      background: #ffffff;
      border: 3px solid #e2ecf5;
      border-radius: 22px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(28, 43, 74, 0.06);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .item-card:active {
      transform: scale(0.95);
    }

    .item-card.selected-pop {
      border-color: #339af0;
      transform: scale(1.03);
    }

    .item-card.correct {
      border-color: #2f9e44;
      background: #ebfbee;
    }

    .item-card.wrong {
      border-color: #e03131;
      background: #fff5f5;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .swatch {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      border: 3px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .item-label {
      font-size: 17px;
      font-weight: 800;
      color: #233044;
    }

    .target-box {
      width: 100%;
      background: #ffffff;
      border: 3px dashed #74c0fc;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .target-title {
      font-size: 14px;
      color: #5c6f87;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .target-value {
      font-size: 24px;
      font-weight: 900;
      color: #1864ab;
    }

    .feedback-banner {
      min-height: 32px;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #2b8a3e;
    }

    .feedback-banner.warn {
      color: #c92a2a;
    }

    .stars-big {
      font-size: 38px;
      margin: 10px 0 14px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-bar">
      <div class="pill">⭐ <span id="starCount">0</span></div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 مؤثرات</button>
        <button class="icon-btn" onclick="goScreen('homeScreen')">🏠 الرئيسية</button>
      </div>
    </div>

    <section id="homeScreen" class="screen active">
      <div class="miro-card">
        <div class="miro-avatar">🦁</div>
        <h1>واحة ميرو للألوان والأشكال</h1>
        <p class="subtitle">استكشف الألوان والأشكال مع ميرو واجمع النجوم في جولات سريعة وممتعة.</p>
      </div>
      <button class="btn-primary" onclick="startGame('colors')">🎨 ابدأ جولة الألوان</button>
      <button class="btn-secondary" onclick="startGame('shapes')">🔺 ابدأ جولة الأشكال</button>
      <button class="btn-secondary" onclick="openExplore()">👀 شاشة الاستكشاف الحر</button>
    </section>

    <section id="exploreScreen" class="screen">
      <div class="miro-card" style="padding:16px; margin-bottom:10px;">
        <h1 style="font-size:21px;">استكشاف الألوان والأشكال</h1>
        <p class="subtitle">اضغط على أي بطاقة لمشاهدة اسمها وتأثيرها البصري.</p>
      </div>
      <div class="grid" id="exploreGrid"></div>
      <button class="btn-primary" onclick="startGame('colors')">🎯 انتقل إلى التحدي</button>
    </section>

    <section id="gameScreen" class="screen">
      <div class="target-box">
        <div class="target-title" id="roundProgress">السؤال 1 من 5</div>
        <div class="target-value" id="targetPrompt">اختر اللون الأحمر</div>
      </div>
      <div class="feedback-banner" id="feedbackBanner"></div>
      <div class="grid" id="optionsGrid"></div>
    </section>

    <section id="resultScreen" class="screen">
      <div class="miro-card">
        <div class="miro-avatar">🏆</div>
        <h1>أنهيت الجولة بنجاح!</h1>
        <p class="subtitle" id="resultSummary">جمعت 5 نجوم في هذه الجولة.</p>
        <div class="stars-big" id="resultStars">⭐⭐⭐⭐⭐</div>
      </div>
      <button class="btn-primary" id="playAgainBtn">🔄 العب مرة أخرى</button>
      <button class="btn-secondary" onclick="goScreen('homeScreen')">🏠 العودة للقائمة الرئيسية</button>
    </section>
  </div>

  <script>
    const COLORS = [
      { id: "red", name: "أحمر", color: "#fa5252", symbol: "🔴" },
      { id: "blue", name: "أزرق", color: "#339af0", symbol: "🔵" },
      { id: "green", name: "أخضر", color: "#40c057", symbol: "🟢" },
      { id: "yellow", name: "أصفر", color: "#fcc419", symbol: "🟡" },
      { id: "purple", name: "بنفسجي", color: "#9775fa", symbol: "🟣" },
      { id: "orange", name: "برتقالي", color: "#ff922b", symbol: "🟠" }
    ];

    const SHAPES = [
      { id: "circle", name: "دائرة", color: "#e7f5ff", symbol: "⚪" },
      { id: "square", name: "مربع", color: "#fff4e6", symbol: "🟧" },
      { id: "triangle", name: "مثلث", color: "#ebfbee", symbol: "🔺" },
      { id: "star", name: "نجمة", color: "#fff9db", symbol: "⭐" },
      { id: "heart", name: "قلب", color: "#fff0f6", symbol: "❤️" },
      { id: "diamond", name: "معين", color: "#f3f0ff", symbol: "🔷" }
    ];

    const sfx = {
      pop: new Audio("audio/pop.wav"),
      success: new Audio("audio/success.wav"),
      tryAgain: new Audio("audio/try_again.wav")
    };

    let soundEnabled = true;
    let totalStars = 0;
    let currentMode = "colors";
    let questionIndex = 0;
    let roundStars = 0;
    let currentTarget = null;
    let locked = false;

    function playSfx(name) {
      if (!soundEnabled) return;
      const audio = sfx[name];
      if (!audio) return;
      try {
        audio.currentTime = 0;
        const promise = audio.play();
        if (promise && typeof promise.catch === "function") {
          promise.catch(() => {});
        }
      } catch (_) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundToggleBtn");
      btn.textContent = soundEnabled ? "🔊 مؤثرات" : "🔇 صامت";
      if (soundEnabled) {
        playSfx("pop");
      }
    }

    function goScreen(screenId) {
      playSfx("pop");
      document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
      const target = document.getElementById(screenId);
      if (target) target.classList.add("active");
    }

    function updateStarCounter() {
      document.getElementById("starCount").textContent = String(totalStars);
    }

    function openExplore() {
      playSfx("pop");
      const grid = document.getElementById("exploreGrid");
      grid.innerHTML = "";
      const combined = [COLORS[0], COLORS[1], COLORS[2], SHAPES[2], SHAPES[3], SHAPES[4]];

      combined.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="swatch" style="background:${item.color};">${item.symbol}</div>
          <div class="item-label">${item.name}</div>
        `;
        card.onclick = () => {
          playSfx("pop");
          card.classList.remove("selected-pop");
          void card.offsetWidth;
          card.classList.add("selected-pop");
        };
        grid.appendChild(card);
      });

      goScreen("exploreScreen");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startGame(mode) {
      currentMode = mode;
      questionIndex = 0;
      roundStars = 0;
      locked = false;
      playSfx("pop");
      goScreen("gameScreen");
      renderQuestion();
    }

    function renderQuestion() {
      locked = false;
      const pool = currentMode === "colors" ? COLORS : SHAPES;
      const shuffledPool = shuffleArray(pool);
      const choices = shuffledPool.slice(0, 4);
      currentTarget = choices[Math.floor(Math.random() * choices.length)];

      document.getElementById("roundProgress").textContent = `السؤال ${questionIndex + 1} من 5`;
      document.getElementById("targetPrompt").textContent =
        currentMode === "colors"
          ? `اختر اللون: ${currentTarget.name}`
          : `اختر الشكل: ${currentTarget.name}`;

      const banner = document.getElementById("feedbackBanner");
      banner.textContent = "";
      banner.classList.remove("warn");

      const optionsGrid = document.getElementById("optionsGrid");
      optionsGrid.innerHTML = "";

      choices.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";
        card.innerHTML = `
          <div class="swatch" style="background:${item.color};">${item.symbol}</div>
          <div class="item-label">${item.name}</div>
        `;
        card.onclick = () => handleChoice(item, card);
        optionsGrid.appendChild(card);
      });
    }

    function handleChoice(item, cardEl) {
      if (locked) return;
      const banner = document.getElementById("feedbackBanner");

      if (item.id === currentTarget.id) {
        locked = true;
        cardEl.classList.add("correct");
        totalStars += 1;
        roundStars += 1;
        updateStarCounter();
        playSfx("success");
        banner.classList.remove("warn");
        banner.textContent = "أحسنت! اختيار صحيح ⭐";

        setTimeout(() => {
          questionIndex += 1;
          if (questionIndex < 5) {
            renderQuestion();
          } else {
            showResult();
          }
        }, 750);
      } else {
        cardEl.classList.add("wrong");
        playSfx("tryAgain");
        banner.classList.add("warn");
        banner.textContent = "جرّب مرة أخرى!";
        setTimeout(() => {
          cardEl.classList.remove("wrong");
        }, 350);
      }
    }

    function showResult() {
      document.getElementById("resultSummary").textContent =
        `جمعت ${roundStars} من 5 نجوم في جولة ${currentMode === "colors" ? "الألوان" : "الأشكال"}.`;
      const starsText = "⭐".repeat(Math.max(1, roundStars));
      document.getElementById("resultStars").textContent = starsText;
      document.getElementById("playAgainBtn").onclick = () => startGame(currentMode);
      goScreen("resultScreen");
    }

    updateStarCounter();
  </script>
</body>
</html>
